<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Boutique exemple — intégration BackToMe</title>

  <!--
    Widget BackToMe : bouton de rétractation conforme à l'article L.221-21
    du Code de la consommation (Ord. n°2026-2, obligation au 19 juin 2026).

    Remplacez VOTRE_SITE_ID par l'identifiant de site (data-site) affiché dans
    le code d'installation de votre tableau de bord backtome.fr/dashboard.

    Aucune autre étape : le bouton flottant s'affiche sur vos pages. Sa
    position, ses couleurs, son libellé et les pages d'affichage se règlent
    depuis le tableau de bord. La langue s'adapte automatiquement à celle du
    visiteur (FR, EN, DE, ES, NL, IT, PT, PL).
  -->
  <script
    src="https://backtome.fr/widget.js"
    data-site="VOTRE_SITE_ID"
    defer
  ></script>
</head>

<body>
  <h1>Ma boutique en ligne</h1>
</body>
</html>
